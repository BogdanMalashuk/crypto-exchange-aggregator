services:
  core:
    build:
      context: .
      dockerfile: ./services/core/Dockerfile
    env_file:
      - ./services/core/.env
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "until pg_isready -h db -U postgres -d cryptodb; do
               echo 'Waiting for postgres...';
               sleep 2;
             done &&
             python services/core/manage.py migrate &&
             python services/core/manage.py runserver 0.0.0.0:8000"
    environment:
      PYTHONPATH: /app/services/core

  celery:
    build:
      context: .
      dockerfile: ./services/core/Dockerfile
    env_file:
      - ./services/core/.env
    depends_on:
      core:
        condition: service_started
      redis:
        condition: service_healthy
    command: >
      celery -A core.celery worker --loglevel=info
    environment:
      PYTHONPATH: /app/services/core

  consumer:
    build:
      context: .
      dockerfile: ./services/core/Dockerfile
    env_file:
      - ./services/core/.env
    depends_on:
      core:
        condition: service_started
      kafka:
        condition: service_healthy
    command: >
      python services/core/manage.py consume_trades
    environment:
      PYTHONPATH: /app/services/core

  gateway:
    build:
      context: .
      dockerfile: ./services/gateway/Dockerfile
    env_file:
      - ./services/gateway/.env
    ports:
      - "8000:8000"
    depends_on:
      core:
        condition: service_started
      kafka:
        condition: service_healthy
    command: >
      uvicorn services.gateway.app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      PYTHONPATH: /app/services/core

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: cryptodb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: psql_password_pass7
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cryptodb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "9092" ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/minio/health/live"]
      interval: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "1025" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
